name: User Workflow QA

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'build.cjs'
      - 'postbuild-workshop.cjs'
      - 'postbuild-workshop-selectall.cjs'
      - 'postbuild-traffic.cjs'
      - 'tests/user-workflow-qa.cjs'
      - '.github/workflows/user-workflow-qa.yml'
  workflow_dispatch:

jobs:
  user-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA tools
        run: |
          npm init -y
          npm install playwright@1.55.0 serve@14.2.4
          npx playwright install --with-deps chromium
      - name: Build exact commit
        run: node build.cjs && node postbuild-workshop.cjs && node postbuild-workshop-selectall.cjs && node postbuild-traffic.cjs
      - name: Start local production build
        run: |
          npx serve dist -l 4173 > /tmp/leftover-user-flow-serve.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/leftover-user-flow-serve.log
          exit 1
      - name: Run user workflow QA
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          node tests/user-workflow-qa.cjs 2>&1 | tee user-workflow-qa.log
      - name: Upload user workflow diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-workflow-qa-log
          path: user-workflow-qa.log
          if-no-files-found: ignore
