name: Accessibility & Performance QA

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'build.cjs'
      - 'tests/accessibility-qa.cjs'
      - 'tests/performance-qa.cjs'
      - '.github/workflows/accessibility-performance-qa.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audit tools
        run: |
          npm init -y
          npm install playwright@1.55.0 @axe-core/playwright@4.10.2 lighthouse@12.8.2 serve@14.2.4
          npx playwright install --with-deps chromium
      - name: Build exact commit
        run: node build.cjs
      - name: Start local production build
        run: |
          npx serve dist -l 4173 > /tmp/leftover-serve.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/leftover-serve.log
          exit 1
      - name: Run accessibility QA
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: node tests/accessibility-qa.cjs
      - name: Run mobile Lighthouse audits
        run: |
          set -o pipefail
          npx lighthouse http://127.0.0.1:4173/ --quiet --chrome-flags='--headless --no-sandbox' --output=json --output-path=lh-home.json
          npx lighthouse http://127.0.0.1:4173/tile --quiet --chrome-flags='--headless --no-sandbox' --output=json --output-path=lh-tile.json
          npx lighthouse http://127.0.0.1:4173/what-can-i-make --quiet --chrome-flags='--headless --no-sandbox' --output=json --output-path=lh-finder.json
          node tests/performance-qa.cjs lh-home.json lh-tile.json lh-finder.json 2>&1 | tee lighthouse-summary.log
      - name: Upload Lighthouse diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-diagnostics
          path: |
            lighthouse-summary.log
            lh-home.json
            lh-tile.json
            lh-finder.json
          if-no-files-found: ignore
