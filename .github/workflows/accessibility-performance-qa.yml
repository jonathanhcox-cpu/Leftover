name: Accessibility & Performance QA

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'tests/accessibility-qa.cjs'
      - 'tests/performance-qa.cjs'
      - '.github/workflows/accessibility-performance-qa.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audit tools
        run: |
          npm init -y
          npm install playwright@1.55.0 @axe-core/playwright@4.10.2 lighthouse@12.8.2
          npx playwright install --with-deps chromium
      - name: Run production accessibility QA
        continue-on-error: true
        run: node tests/accessibility-qa.cjs
      - name: Run mobile Lighthouse audits
        run: |
          npx lighthouse https://www.buildwithleftovers.com/ --quiet --chrome-flags='--headless --no-sandbox' --output=json --output-path=lh-home.json
          npx lighthouse https://www.buildwithleftovers.com/tile --quiet --chrome-flags='--headless --no-sandbox' --output=json --output-path=lh-tile.json
          npx lighthouse https://www.buildwithleftovers.com/what-can-i-make --quiet --chrome-flags='--headless --no-sandbox' --output=json --output-path=lh-finder.json
          node tests/performance-qa.cjs lh-home.json lh-tile.json lh-finder.json
