name: Calculator QA

on:
  push:
    branches: [main]
    paths:
      - 'public/engine.js'
      - 'public/app.js'
      - 'build.cjs'
      - 'tests/engine-regression.cjs'
      - 'tests/engine-property.cjs'
      - '.github/workflows/calculator-qa.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic regression suite
        run: node tests/engine-regression.cjs
      - name: Run randomized property suite
        run: node tests/engine-property.cjs
