<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Baseboard for a 12 by 12 foot room</title><desc id="desc">Four 12-foot walls with a centered 3-foot opening on the bottom wall, leaving two 4.5-foot sections. Net baseboard length is 45 feet.</desc><rect width="1200" height="720" fill="#f3f5ef"/><g font-family="Arial,sans-serif" fill="#173f35"><text x="70" y="72" font-size="32" font-weight="bold">A room measured in runs</text><path d="M320 560 H170 V160 H570 V560 H420" fill="none" stroke="#173f35" stroke-width="12"/><path d="M320 560 H420" fill="none" stroke="#b77f4f" stroke-width="3" stroke-dasharray="8 8"/><text x="332" y="137" font-size="26">12 ft</text><text x="90" y="370" font-size="26">12 ft</text><text x="592" y="370" font-size="26">12 ft</text><text x="184" y="605" font-size="25">4.5 ft</text><text x="457" y="605" font-size="25">4.5 ft</text><text x="335" y="605" font-size="25">3 ft</text><text x="303" y="637" font-size="18">opening</text><text x="720" y="210" font-size="22">PERIMETER</text><text x="720" y="264" font-size="44" font-weight="bold">48 linear feet</text><text x="720" y="345" font-size="22">LESS 3-FOOT OPENING</text><text x="720" y="399" font-size="44" font-weight="bold">45 linear feet</text><text x="720" y="480" font-size="22">WITH 10% RESERVE</text><text x="720" y="534" font-size="44" font-weight="bold">49.5 linear feet</text><text x="70" y="689" font-size="19">Illustrative takeoff. Measure actual casing edges, corners and usable stock before cutting.</text></g></svg>
